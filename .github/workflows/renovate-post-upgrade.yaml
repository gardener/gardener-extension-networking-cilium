name: Renovate Post-Upgrade Tasks

on:
  pull_request:
    branches:
      - master
      - 'release-v*'

permissions:
  contents: read

jobs:
  post-upgrade-tasks:
    name: Run Post-Upgrade Tasks
    # Only run for genuine Renovate PRs: authored by the Renovate app, from a renovate/* branch
    # in this repository. The actor check prevents any org member from naming a branch renovate/*
    # to have their own Makefile output committed back and laundered as the bot.
    if: >-
      github.repository == 'gardener/gardener-extension-networking-cilium' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changes: ${{ steps.diff.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          # Full history is required to diff against the PR base commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Sync cilium sidecar images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # cilium-envoy and certgen are synced from the upstream cilium/cilium values.yaml
          # pinned by the bumped cilium-agent (quay.io/cilium/cilium) release.
          base_tag="$(git show "${BASE_SHA}:imagevector/images.yaml" | yq '.images[] | select(.name == "cilium-agent").tag')"
          head_tag="$(yq '.images[] | select(.name == "cilium-agent").tag' imagevector/images.yaml)"
          if [ "${base_tag}" != "${head_tag}" ]; then
            python3 ./scripts/sync-cilium-sidecar-images.py "${head_tag}"
          fi
      - name: Run post-upgrade tasks
        run: |
          set -euo pipefail
          export PATH="${PATH}:$(go env GOROOT)/bin"
          make generate MODE="sequential"
      - name: Capture changes
        id: diff
        run: |
          set -euo pipefail
          # Only capture the paths the post-upgrade tasks legitimately write: the generated
          # charts/code/examples, the Renovate ignore-deps config, and the sidecar image tags
          # synced into imagevector/images.yaml. This prevents the committed-back patch from
          # carrying arbitrary content a branch's Makefile might have produced elsewhere.
          git add -A -- 'charts/**' 'cmd/**' 'example/**' 'pkg/**' 'renovate.json5' 'imagevector/images.yaml'
          if git diff --cached --quiet; then
            echo "has-changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has-changes=true" >> "${GITHUB_OUTPUT}"
            git diff --cached --binary > "${RUNNER_TEMP}/post-upgrade.patch"
          fi
      - name: Upload patch
        if: steps.diff.outputs.has-changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post-upgrade-changes
          path: ${{ runner.temp }}/post-upgrade.patch
          retention-days: 1

  commit:
    name: Commit Changes
    needs: post-upgrade-tasks
    if: needs.post-upgrade-tasks.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up git identity
        uses: gardener/cc-utils/.github/actions/setup-git-identity@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: post-upgrade-changes
          path: ${{ runner.temp }}
      - name: Apply patch and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git apply --3way --whitespace=nowarn "${RUNNER_TEMP}/post-upgrade.patch"
          git add -A
          git commit -m "Run make generate"
          git push origin "HEAD:${HEAD_REF}"
