name: Build
on:
  # Only pushes to the default branch and release branches publish credentialed
  # snapshot artifacts; other branches are validated through pull_request without
  # publish credentials.
  push:
    branches:
      - master
      - release-*
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@bce63f62928717a11f610ec8022af9feb497d5df # v1
    needs:
      - build
    permissions:
      id-token: write
      contents: write
