name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch

# Serialize release runs so a re-dispatch cannot run concurrently with an in-flight
# release and race the tag/publish/bump window. Never cancel an
# in-progress release: a half-published release must finish, not be interrupted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


jobs:
  build:
    # Only dispatches from the default branch may mint a release. Repo-global tags
    # mean a dispatch from any ref would otherwise publish the real version tag,
    # bypassing branch protection.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      mode: release

  release-to-github-and-bump:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: gardener/cc-utils/.github/workflows/release.yaml@v1
    needs:
      - build
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      next-version-callback-action-path: .github/actions/prepare-release
      slack-channel-id: C9CEBQPGE # #sap-tech-gardener
